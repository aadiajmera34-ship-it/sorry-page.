<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background: linear-gradient(180deg,#ffd9ea,#fff5fa);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Comic Neue','Segoe UI',sans-serif;
  overflow:hidden;
}

/* floating emojis */
.emoji{
  position:absolute;
  bottom:-30px;
  font-size:22px;
  animation: float 8s linear infinite;
  opacity:0.8;
}
@keyframes float{
  to{transform:translateY(-120vh) rotate(360deg);}
}

/* sparkles */
.sparkle{
  position:absolute;
  font-size:14px;
  opacity:.6;
  animation: twinkle 3s infinite;
}
@keyframes twinkle{
  50%{opacity:.2; transform:scale(1.4);}
}

/* envelope */
.envelope{
  width:260px;
  height:170px;
  background:#ffe4f1;
  border-radius:22px;
  position:relative;
  box-shadow:0 18px 35px rgba(255,120,170,.35);
  cursor:pointer;
  animation:bounce 2s infinite, glow 3s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-8px);}
}
@keyframes glow{
  50%{box-shadow:0 0 35px rgba(255,120,170,.6);}
}

/* flap */
.flap{
  position:absolute;
  top:0;
  width:100%;
  height:85px;
  background:#ffb6d5;
  clip-path:polygon(0 0,50% 100%,100% 0);
  border-radius:22px 22px 0 0;
  transition:top .6s ease;
}
.envelope.open .flap{
  top:-80px;
}

/* seal */
.seal{
  position:absolute;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  font-size:26px;
  animation: beat 1.2s infinite;
}
@keyframes beat{
  0%,100%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.2);}
}

/* tap text */
.tap{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  color:#ff6fa5;
  font-size:14px;
}

/* letter */
.letter{
  position:fixed;
  width:320px;
  background:linear-gradient(180deg,#ffffff,#fff7fb);
  border-radius:24px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 22px 45px rgba(255,120,170,.4);
  display:none;
  animation:pop .6s ease;
}
@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

h2{
  color:#ff6fa5;
  margin-bottom:10px;
}

#text{
  color:#ff85b3;
  font-size:14px;
  line-height:1.6;
  min-height:190px;
}

/* button */
button{
  background:linear-gradient(135deg,#ff6fa5,#ff9fc7);
  border:none;
  color:white;
  padding:10px 24px;
  border-radius:25px;
  font-size:14px;
  margin-top:14px;
  display:none;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(255,120,170,.6);
}

.done{
  color:#ff6fa5;
  margin-top:12px;
  display:none;
}
</style>
</head>

<body>

<!-- soft cute music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/03/27/audio_8ef3b86b3a.mp3">
</audio>

<div class="envelope" id="env" onclick="openEnv()">
  <div class="flap"></div>
  <div class="seal">💖</div>
  <div class="tap">Tap to open 💌</div>
</div>

<div class="letter" id="letter">
  <h2>Hey Ayushi 💗</h2>
  <div id="text"></div>
  <button id="btn" onclick="forgive()">Forgive me? 🫂</button>
  <div class="done" id="done">Thank you 💕 I promise to be better ✨</div>
</div>

<script>
/* floating emojis */
const emojis = ["✨","🌸","💫","🧸","💕"];
for(let i=0;i<20;i++){
  let e=document.createElement("div");
  e.className="emoji";
  e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=(Math.random()*4+5)+"s";
  document.body.appendChild(e);
}

/* sparkles */
for(let i=0;i<10;i++){
  let s=document.createElement("div");
  s.className="sparkle";
  s.innerHTML="✨";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
}

/* message */
const msg=`
Heyyy 🥺💗

I’m really sorry if I made you feel ignored…
That was never my intention 🫂

I was busy, but you are still very important to me 🌸
I care about you a lot 💕

I promise more time,
more attention,
and more smiles ✨

Please forgive me 💖
`;

let i=0;

function openEnv(){
  document.getElementById("env").classList.add("open");
  document.getElementById("music").play();

  setTimeout(()=>{
    document.getElementById("env").style.display="none";
    document.getElementById("letter").style.display="block";
    type();
  },700);
}

function type(){
  if(i<msg.length){
    document.getElementById("text").innerHTML+=
      msg[i]=="\n"?"<br>":msg[i];
    i++;
    setTimeout(type,30);
  }else{
    document.getElementById("btn").style.display="inline-block";
  }
}

function forgive(){
  document.getElementById("btn").style.display="none";
  document.getElementById("done").style.display="block";
}
</script>

</body>
</html>
